<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ── Primary SEO ──────────────────────────────────────────── -->
    <title>pointpoker — Free Online Planning Poker for Agile &amp; Scrum Teams</title>
    <meta name="description" content="pointpoker is a free online planning poker tool for agile and scrum teams. Run sprint planning with real-time voting, story point estimation, story queues, and team alignment analytics." />
    <meta name="keywords" content="pointpoker, point poker, planning poker, online planning poker, free planning poker, scrum poker, agile estimation, sprint planning, story points, fibonacci estimation, story point estimation, remote sprint planning, scrum estimation tool, team alignment" />
    <meta name="author" content="pointpoker" />
    <meta name="application-name" content="pointpoker" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.pointpoker.app/" />

    <!-- ── Open Graph (LinkedIn, Facebook, WhatsApp, Slack) ────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.pointpoker.app/" />
    <meta property="og:title" content="pointpoker — Free Online Planning Poker for Agile Teams" />
    <meta property="og:description" content="Run sprint planning with real-time planning poker, simultaneous reveal, story queues, and team alignment analytics." />
    <meta property="og:image" content="https://www.pointpoker.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="pointpoker planning poker app on a dark green background" />
    <meta property="og:site_name" content="pointpoker" />
    <meta property="og:locale" content="en_GB" />

    <!-- ── Twitter / X Card ─────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.pointpoker.app/" />
    <meta name="twitter:title" content="pointpoker — Free Online Planning Poker for Agile Teams" />
    <meta name="twitter:description" content="Run sprint planning with real-time planning poker, simultaneous reveal, story queues, and team alignment analytics." />
    <meta name="twitter:image" content="https://www.pointpoker.app/og-image.png" />
    <meta name="twitter:image:alt" content="pointpoker planning poker app on a dark green background" />

    <!-- ── Theme & PWA ───────────────────────────────────────────── -->
    <meta name="theme-color" content="#0c1a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="pointpoker" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ── Favicons ──────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- ── Fonts ─────────────────────────────────────────────────── -->
    <!-- Both fonts are self-hosted — no Google Fonts dependency. -->
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/fonts.css" />

    <!-- ── Critical inline styles (prevents flash before React loads) ── -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body {
        background: #0c1a0f;
        font-family: 'Outfit', 'Segoe UI', sans-serif;
        color: #eff2f7;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; }
    </style>

    <!-- ── JSON-LD Structured Data ───────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "pointpoker",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "pointpoker is a free online planning poker tool with real-time voting, story queue management, team alignment analytics, and estimation spree tracking for agile teams.",
      "offers": [
        {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "GBP",
          "name": "Free",
          "description": "Up to 6 participants, all card decks, story queue, session summary — no account required."
        },
        {
          "@type": "Offer",
          "price": "6",
          "priceCurrency": "GBP",
          "name": "Pro",
          "billingIncrement": "P1M",
          "description": "Persistent Team Room URL, up to 20 participants, unlimited stories, priority support."
        }
      ],
      "url": "https://www.pointpoker.app/",
      "featureList": [
        "Real-time simultaneous vote reveal — eliminates anchoring bias",
        "Fibonacci, T-Shirt sizing, and Powers of 2 card decks",
        "Story queue — work through your full backlog in order",
        "Team alignment analytics — consensus rate, total story points, re-vote tracking",
        "Estimation Spree — live streak counter for consecutive consensus rounds",
        "Built-in countdown timer to keep sessions focused",
        "Session summary — copy all estimates to clipboard",
        "Facilitator mode for non-voting hosts with analytics dashboard",
        "Team Room — persistent URL reused every sprint (Pro)",
        "No account or sign-up required",
        "Works for remote and distributed teams"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is this planning poker tool actually free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Free rooms support up to 6 participants, all three card decks, story queues, analytics, and clipboard export with no credit card or account required."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No account is required for free rooms. Accounts are only used for account-linked Pro billing and plan restoration across devices."
          }
        },
        {
          "@type": "Question",
          "name": "Why use Fibonacci numbers for story points?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fibonacci story points reflect how uncertainty grows with complexity and help teams avoid false precision during estimation."
          }
        },
        {
          "@type": "Question",
          "name": "Does this work for remote and distributed teams?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Share one room link in Slack, Teams, Zoom, or email and everyone can join from any modern browser on desktop or mobile."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Team Alignment score?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Team Alignment score shows how often the team reached first-round consensus, helping facilitators spot stories that need clearer acceptance criteria."
          }
        },
        {
          "@type": "Question",
          "name": "How many people can join a planning poker session?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Free rooms support up to 6 voters. Pro rooms support up to 20 voters. Facilitators and other non-voting stakeholders do not use a voter slot."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <noscript>pointpoker requires JavaScript to run. Please enable JavaScript in your browser.</noscript>
    <div id="root"></div>
  </body>
</html>
