<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="card-clip">
      <rect x="8" y="8" width="84" height="84" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect x="8" y="8" width="84" height="84" rx="14" ry="14" fill="#12261a"/>

  <!-- Gold border -->
  <rect x="8" y="8" width="84" height="84" rx="14" ry="14"
        fill="none" stroke="#c9912a" stroke-width="2.5"/>

  <!-- Spade shape -->
  <!-- Left lobe -->
  <circle cx="37" cy="45" r="12" fill="#e8b84b"/>
  <!-- Right lobe -->
  <circle cx="63" cy="45" r="12" fill="#e8b84b"/>
  <!-- Top tip triangle -->
  <polygon points="50,22 32,50 68,50" fill="#e8b84b"/>
  <!-- Body -->
  <rect x="42" y="48" width="16" height="16" fill="#e8b84b"/>
  <!-- Stem triangle -->
  <polygon points="50,64 41,74 59,74" fill="#e8b84b"/>
  <!-- Stem base bar -->
  <rect x="38" y="72" width="24" height="4" rx="2" fill="#e8b84b"/>
</svg>
